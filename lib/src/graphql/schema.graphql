#*************************** SCALAR ***************************
scalar Long
#*************************** INTERFACE ***************************
interface BasicEntity {
  id: ID!
  creationDate: Long!
  lastUpdate: Long!
}

interface IndexedEntity implements BasicEntity {
  id: ID!
  score: Float!
  creationDate: Long!
  lastUpdate: Long!
}
################################# QUERIES #############################

type Query {
  sayHello: String!
  importData: String
  getProductById(productId: String!): Product!
  getProducts(pageInfo: PageInfo!): [Product!]!
  getCategoryById(categoryId: String!): Category!
  getRootCategories(pageInfo: PageInfo!): [Category!]!
  countRootCategories: Long!
  getCategories(pageInfo: PageInfo!): [Category!]!
  findCategoriesByParentId(parentId: String!, pageInfo: PageInfo!): [Category!]!
  countCategoriesByParentId(parentId: String!): Long!
  countProducts: Long!
  countCategories: Long!
  searchProducts(pageInfo: PageInfo!, params: ProductParamSearch!): [Product!]!
  countSearchProduct(params: ProductParamSearch!): Long!
  imageSearch(skuId: String!): [Sku!]!
  imageSearchByText(data: String!): [Sku!]!
  collectionMappings: [CollectionMapping!]!
  getSkuById(id: String!): Sku

  findSkus(params: SkuParamSearch!  pageInfo: PageInfo!): [Sku!]!
  countSkus(params: SkuParamSearch!): Int!

  getSkusByProductId(productId: String!): [Sku!]!
  aggregate: [SkuKey!]!
  listIndexElements(pageInfo: PageInfo!, name: String): [ColorIndex!]!
  countIndexElements(name: String): Long!
  getCategoryTree: [CategoryTreeItem!]!

  getAdjacencyById(adjacencyId: ID!): Adjacency
  getAdjacencies(pageInfo: PageInfo!, type: AdjacencyType!): [Adjacency!]!

  getCategodyAdjacencyById(adjacencyId: ID!): CategoryAdjacency
  getCategoryAdjacencies(pageInfo: PageInfo!): [CategoryAdjacency!]!
  countAdjacenciesByType(type: AdjacencyType): Long!

  findColorIndexByColorHex(color: String!, pageInfo: PageInfo!): [ColorIndex!]!
  getAdjecencyEntries(type: AdjacencyType!): [String!]!

  getRuleById(id: ID!): Rule!

  findRulesByType(ruleType: RuleType!, pageInfo: PageInfo!): [Rule!]!
  findRules(pageInfo: PageInfo!): [Rule!]!
  countRules: Long!
  ruleFieldConfigList: [RuleFieldConfig!]!
  getSeasons: [Season!]!

  getAllBrands: [String!]!
  getAllDesigners: [String!]!
  getAllGenders: [String!]!
  getAllColorLabels: [String!]!
}
type SkuKey {
  imageUrl: String!
  colorLabel: String!
  docCount: Int!
}
################################# MUTATIONS #############################

type Mutation {
  login(username: String!, password: String!): TokenUser!
  refreshToken(token: String!): TokenUser!
  addUser(name: String!): User!
  deleteProductById(productId: String!): ID
  deleteCategoryById(categoryId: String!): ID
  addCategory(input: CategoryInput!): Category!
  updateProductSimilarities(
    productId: String!
    similarities: [QueueItem!]!
  ): Product!

  updateProductComplementaries(
    productId: String!
    complementaries: [QueueItem!]!
  ): Product!

  saveCollectionMapping(input: CollectionMappingInput!): CollectionMapping!
  generateIndex: String
  updateDistance(id: String!, distance: Float!): ID

  addAdjacency(input: AdjacencyInput!): Adjacency!
  addCategoryAdjacency(input: AdjacencyInput!): CategoryAdjacency!
  deleteAdjacencyById(adjacencyId: ID!): ID
  updateAdjacencyDistance(id: String!, distance: Float!): ID
  createRule(input: RuleInput!): Rule!
  deleteRule(id: ID!): String
}
################################# TYPES #############################

type User implements BasicEntity {
  id: ID!
  creationDate: Long!
  lastUpdate: Long!
  name: String!
}

type ResponseToken {
  accessToken: String!
  expiresIn: Int!
  refreshExpiresIn: Int!
  refreshToken: String!
  tokenType: String!
  notBeforePolicy: Int!
  sessionState: String!
  scope: String!
}

type TokenUser {
  token: ResponseToken!
  user: FeUser!
}

type FeUser {
  name: String!
  email: String
  roles: [String!]!
}

type RecsUser {
  exp: Long!
  iat: Long!
  jti: String!
  iss: String!
  aud: String!
  sub: String!
  typ: String!
  azp: String!
  sessionState: String!
  acr: String!
  allowedOrigins: [String!]!
  realmAccess: RealmAccess!
  resourceAccess: ResourceAccess!
  scope: String!
  sid: String!
  emailVerified: Boolean!
  name: String
  preferredUsername: String!
  givenName: String
  familyName: String
  email: String
}

type RealmAccess {
  roles: [String!]!
}

type ResourceAccess {
  account: Account!
}

type Account {
  roles: [String!]!
}

type RuleFieldConfig {
  label: String!
  path: String!
  ruleType: RuleType!
}

type Rule implements IndexedEntity & BasicEntity {
  id: ID!
  creationDate: Long!
  lastUpdate: Long!
  score: Float!
  context: RuleContext!
  config: RuleFieldConfig!
  booleanRule: BooleanRule
  textRule: TextRule
  textRuleCategory: TextRuleCategory
  textRuleSeason: TextRuleSeason
  textRuleProduct: TextRuleProduct
  textRuleSku: TextRuleSku
  numberRule: NumberRule
}

type BooleanRule {
  acceptedValue: Boolean!
}

type TextRule {
  acceptedValues: [String!]!
  matchType: TextRuleMatchType!
  entityType: TextRuleEntityType!
}

type TextRuleCategory {
  acceptedValues: [Category!]!
  matchType: TextRuleMatchType!
}

type TextRuleSeason {
  acceptedValues: [Season!]!
  matchType: TextRuleMatchType!
}

type TextRuleProduct {
  acceptedValues: [Product!]!
  matchType: TextRuleMatchType!
}

type TextRuleSku {
  acceptedValues: [Sku!]!
  matchType: TextRuleMatchType!
}

type NumberRule {
  percentage: Boolean!
  lowerBound: Float!
  upperBound: Float!
  sameValueOnly: Boolean!
}

type RuleContext {
  brands: [String!]!
  designers: [String!]!
  categories: [Category!]!
  colorLabels: [String!]!
  products: [Product!]!
  skus: [Sku!]!
  appliesOnAllProducts: Boolean!
}

type Adjacency implements IndexedEntity & BasicEntity {
  id: ID!
  creationDate: Long!
  lastUpdate: Long!
  score: Float!
  entryId1: String!
  entryId2: String!
  distance: Float!
  type: AdjacencyType!
}

type CategoryAdjacency implements IndexedEntity & BasicEntity {
  id: ID!
  creationDate: Long!
  lastUpdate: Long!
  score: Float!
  entryId1: String!
  entryId2: String!
  category1: Category!
  category2: Category!
  distance: Float!
  type: AdjacencyType!
}

type ColorIndex implements IndexedEntity & BasicEntity {
  id: ID!
  creationDate: Long!
  lastUpdate: Long!
  score: Float!
  color1: String!
  color2: String!
  name1: String!
  name2: String!
  distance: Float
  manual: Boolean!
}

type Product implements IndexedEntity & BasicEntity {
  id: ID!
  creationDate: Long!
  lastUpdate: Long!
  score: Float!
  brand: String
  name: String!
  designer: String
  category: Category!
  shortDescription: String
  longDescription: String
  price: Float!
  oldPrice: Float!
  forKids: Boolean!
  gender: String
  skuCount: Long!
  skuList: [Sku!]!
  firstImageUrl: String!
}

type Sku implements IndexedEntity & BasicEntity {
  id: ID!
  creationDate: Long!
  lastUpdate: Long!
  score: Float!
  name: String!
  shortDescription: String
  longDescription: String
  gtin: String!
  colorLabel: String!
  imageUrl: String!
  inventories: [Inventory!]!
  totalInventory: Long!
  brand: String
  designer: String
  category: Category!
  price: Float!
  oldPrice: Float!
  forKids: Boolean!
  gender: String
}



type Inventory {
  sizeLabel: String!
  inventory: Long!
  seasons: [String!]!
}

type Season {
  startDate: Long!
  endDate: Long!
  code: String!
}

type Category implements IndexedEntity & BasicEntity {
  id: ID!
  creationDate: Long!
  lastUpdate: Long!
  score: Float!
  name: String!
  parent: CategoryInfo
  childCategoryCount: Long!
}

type CategoryTreeItem {
  root: Category!
  childCatgories: [Category!]!
}

type CategoryInfo {
  id: ID!
  name: String!
}

type CollectionMapping {
  id: ID
  creationDate: Long!
  lastUpdate: Long!
  headers: [String!]!
  dateFormat: String
  fileMask: String
  delimiter: String
  collectionName: String!
  collectionLabel: String!
  fields: [FieldMapping!]!
}

type FieldMapping {
  label: String!
  name: String!
  type: DataType!
  required: Boolean!
  csvFieldValue: String
  csvFieldDefaultValue: String
}
################################# INPUTS #############################

input RuleInput {
  id: String
  contextInput: RuleContextInput!
  ruleType: RuleType!
  ruleFieldConfigInput: RuleFieldConfigInput!
  booleanRuleInput: BooleanRuleInput
  textRuleInput: TextRuleInput
  numberRuleInput: NumberRuleInput
}

input RuleFieldConfigInput {
  label: String!
  path: String!
  ruleType: RuleType!
}

input RuleContextInput {
  brands: [String!]!
  designers: [String!]!
  categoryIds: [String!]!
  colorLabels: [String!]!
  productIds: [String!]!
  skuIds: [String!]!
  appliesOnAllProducts: Boolean!
}

input BooleanRuleInput {
  acceptedValue: Boolean!
}

input TextRuleInput {
  acceptedValues: [String!]!
  matchType: TextRuleMatchType!
  entityType: TextRuleEntityType!
}

input NumberRuleInput {
  percentage: Boolean!
  lowerBound: Float!
  upperBound: Float!
  sameValueOnly: Boolean!
}



input AdjacencyInput {
  entryId1: String!
  entryId2: String!
  distance: Float!
  type: AdjacencyType!
  manual: Boolean!
}

input CollectionMappingInput {
  id: String
  headers: [String]!
  dateFormat: String!
  fileMask: String!
  delimiter: String!
  collectionName: String!
  collectionLabel: String!
  fields: [FieldMappingInput!]!
}

input FieldMappingInput {
  label: String!
  name: String!
  type: DataType!
  csvFieldValue: String
  required: Boolean
  csvFieldDefaultValue: String
}

input ProductInput {
  name: String!
  brand: String!
  price: Float!
  oldPrice: Float!
  imageUrl: String
  categoryId: String!
}

input PageInfo {
  page: Int!
  size: Int!
}
input CategoryInput {
  name: String!
  parentId: String
}

input ProductParamSearch {
  productId: String
  name: String
  brand: String
  categoryIds: [String!]
}

input SkuParamSearch {
  skuId: String
  productId: String
  name: String
  brand: String
  categoryIds: [String!]
}

input QueueItem {
  productId: String!
  rank: Int!
}
################################# ENUMS #############################
enum DataType {
  STRING
  DOUBLE
  INT
  BOOLEAN
  DATE
  DATETIME
}

enum AdjacencyType {
  CATEGORY
  COLOR_LABEL
  BRAND
  DESIGNER
}

enum RuleType {
    NUMBER_RULE TEXT_RULE BOOLEAN_RULE
}

enum TextRuleMatchType {
    SAME_VALUE ADJACENT_VALUES ACCEPTED_VALUES
}

enum TextRuleEntityType {
    STRING SEASON CATEGORY PRODUCT SKU
}
