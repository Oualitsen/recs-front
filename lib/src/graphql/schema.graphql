#*************************** SCALAR ***************************
scalar Long

type Query {
  sayHello: String!
}

type Mutation {
  login(username: String!, password: String!): TokenUser!
  refreshToken(token: String!): TokenUser!
}

type ResponseToken {
  accessToken: String!
  expiresIn: Int!
  refreshExpiresIn: Int!
  refreshToken: String!
  tokenType: String!
  notBeforePolicy: Int!
  sessionState: String!
  scope: String!
}

type TokenUser {
  token: ResponseToken!
  user: RecsUser!
}

type RecsUser {
  exp: Long!
  iat: Long!
  jti: String!
  iss: String!
  aud: String!
  sub: String!
  typ: String!
  azp: String!
  sessionState: String!
  acr: String!
  allowedOrigins: [String!]!
  realmAccess: RealmAccess!
  resourceAccess: ResourceAccess!
  scope: String!
  sid: String!
  emailVerified: Boolean!
  name: String
  preferredUsername: String!
  givenName: String
  familyName: String
  email: String
}

type RealmAccess {
  roles: [String!]!
}

type ResourceAccess {
  account: Account!
}

type Account {
  roles: [String!]!
}
input pageInfo {
  page: Int!
  size: int!
}
